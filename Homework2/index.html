<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
</head>

<body>
    <main>
        <h1>Drum Kit</h1>

        <button
            type="button"
            class="drum-pad"
            data-key="a"
            data-sound="assets/kick.wav"
        >
            A - Kick
        </button>

        <button
            type="button"
            class="drum-pad"
            data-key="s"
            data-sound="assets/snare.wav"
        >
            S - Snare
        </button>

        <button
            type="button"
            class="drum-pad"
            data-key="d"
            data-sound="assets/hihat.wav"
        >
            D - Hi-hat
        </button>
    </main>
</body>
</html>
<script src="script.js"></script>
