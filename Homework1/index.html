<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoang Anh - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <meta
    http-equiv="Content-Security-Policy"
    content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        img-src 'self' data:;
        object-src 'none';
        base-uri 'self';
    "
>
</head>

<body>
    <header>
        <h1>Dang Hoang Anh</h1>
        <p>Information Systems Student</p>
    </header>

    <nav aria-label="Main navigation">
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>
                I am an Information Systems student interested in web development.
            </p>
        </section>

        <section id="projects">
            <h2>Projects</h2>

            <article>
                <h3>Web Application Project</h3>
                <p>A sample web development project.</p>
            </article>
        </section>

        <section id="contact">
            <h2>Contact</h2>

            <form>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dang Hoang Anh</p>
    </footer>
</body>
</html>
